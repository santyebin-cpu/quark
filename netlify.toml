[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Serve /hadron as hadron.html (Astro `build.format: "file"`).
[[redirects]]
  from = "/*"
  to = "/:splat.html"
  status = 200
  force = false

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
